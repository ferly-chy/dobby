name: Dobby Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan untuk membuat rilis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build All Android ABIs
        run: |
          python3 scripts/platform_builder.py --platform android --arch all --ndk ${{ steps.setup-ndk.outputs.ndk-path }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Distribute Artifacts
        run: |
          # Menggabungkan semua build (static & shared) ke dalam zip dobby-distribution.zip
          python3 scripts/distribute.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-distribution
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Dobby Android Build #${{ github.run_number }}"
          files: dobby-distribution.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
