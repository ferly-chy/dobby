name: Dobby Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build All Android ABIs
        run: |
          python3 scripts/platform_builder.py --platform android --arch all
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Distribute Artifacts
        run: |
          # Menggabungkan semua build (static & shared) ke dalam satu paket rilis
          python3 scripts/distribute.py --type both --out dobby_release

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dobby-android-release
          path: dobby_release/
